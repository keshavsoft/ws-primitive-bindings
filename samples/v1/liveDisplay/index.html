<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Display Sample — ws-primitive-bindings (v1)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-broadcast text-warning me-2"></i>ws-primitive-bindings <span class="badge bg-primary">v1</span>
      </a>
      <span class="navbar-text text-light">Declarative WebSocket Binding</span>
    </div>
  </nav>

  <main class="container py-2" style="max-width: 800px;">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1 fw-bold text-dark">Live Display WebSocket Client</h1>
            <p class="text-muted small mb-0">
              Connected live via <code>bindings.json</code> + <code>actions.js</code> + <code>bindWs()</code>.
            </p>
          </div>
          <span class="badge bg-secondary" id="statusBadge">Connecting…</span>
        </div>

        <!-- Token Display Card -->
        <div class="p-4 rounded text-center my-3 text-white" style="background: linear-gradient(135deg, #07111d 0%, #15273b 100%);">
          <div class="small text-white-50 text-uppercase letter-spacing-1 mb-1">Current Call Number</div>
          <div class="display-1 fw-bold my-2" id="currentToken">—</div>
          <div class="small text-white-70">Waiting for live announcements from Doctor...</div>
        </div>

        <!-- Feedback Console -->
        <div class="bg-dark text-info font-monospace small p-3 rounded mt-3" id="liveLog">
          // Waiting for WebSocket handshake event...
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
