<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo Client — ws-primitive-bindings (v1)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-broadcast text-warning me-2"></i>ws-primitive-bindings <span class="badge bg-primary">v1</span>
      </a>
      <span class="navbar-text text-light">Interactive Echo Client</span>
    </div>
  </nav>

  <main class="container py-2" style="max-width: 800px;">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-1 fw-bold text-dark">Interactive Socket Echo Client</h1>
            <p class="text-muted small mb-0">
              Send messages and observe events mapped through <code>bindings.json</code> + <code>actions.js</code>.
            </p>
          </div>
          <span class="badge bg-secondary" id="echoStatus">Connecting…</span>
        </div>

        <div class="input-group mb-3">
          <input type="text" class="form-control" id="msgInput" placeholder="Enter message payload to send...">
          <button class="btn btn-primary" id="sendBtn" type="button">
            <i class="bi bi-send me-1"></i> Send
          </button>
        </div>

        <div class="bg-dark text-light font-monospace small p-3 rounded" id="echoLog" style="height: 250px; overflow-y: auto;">
          <div class="text-secondary">// Socket activity stream...</div>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>

</html>
